<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">腾讯 IMA × 企业微信文档 SKILL 集合</title>
  <desc id="hero-desc">左侧展示腾讯 IMA 与企业微信文档读写能力定位；右侧展示图片/PDF 解析后写入企业微信智能表格 / 在线表格 / 在线文档的流程示意。</desc>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1E2F"/>
      <stop offset="1" stop-color="#0E2A3E"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A8FFF"/>
      <stop offset="1" stop-color="#5BD8C2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B3A52" stroke-width="1" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="22" fill="url(#grid)"/>

  <!-- Left column: Title + value -->
  <g id="title-block" transform="translate(56 56)">
    <!-- IMA Tag -->
    <g>
      <rect x="0" y="0" width="148" height="32" rx="16" fill="#0F2A40" stroke="#1A8FFF" stroke-width="1.2"/>
      <circle cx="18" cy="16" r="5" fill="#1A8FFF"/>
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#9DD4FF" letter-spacing="0.6">Tencent IMA · SKILL</text>
    </g>

    <!-- Project name -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="44" font-weight="700" fill="#F4F8FB" letter-spacing="-0.5">wecom-smartsheet-mcp-server</text>

    <!-- Subtitle / value -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="21" font-weight="500" fill="#E2ECF5">腾讯 IMA 操作企业微信文档的 SKILL 集合</text>
    <text x="0" y="180" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="16" font-weight="400" fill="#9DB3C6">提供企业微信智能表格 / 在线表格 / 在线文档的读写能力。</text>

    <!-- Why different -->
    <g transform="translate(0 222)">
      <rect x="0" y="0" width="6" height="68" fill="url(#accent-grad)" rx="3"/>
      <text x="20" y="22" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="15" font-weight="600" fill="#F4F8FB">IMA 的「图片 / PDF 解析」× 企微「表格读写」</text>
      <text x="20" y="48" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13.5" font-weight="400" fill="#9DB3C6">把扫描件、票据、截图里的数据，直接落到企业微信团队表里。</text>
    </g>

    <!-- Meta row -->
    <g transform="translate(0 314)">
      <text font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7A93A8">
        <tspan x="0" y="0" fill="#5BD8C2">●</tspan>
        <tspan x="14" y="0">curl · 仅依赖企微 CorpID + 自建应用 Secret</tspan>
      </text>
    </g>
  </g>

  <!-- Right column: pipeline -->
  <g id="pipeline" transform="translate(720 56)">
    <!-- Card background -->
    <rect x="0" y="0" width="424" height="308" rx="18" fill="#0B2438" stroke="#1F4866" stroke-width="1"/>

    <!-- Section label -->
    <text x="20" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" fill="#5BD8C2" letter-spacing="2">PIPELINE</text>
    <text x="20" y="50" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="500" fill="#C5D8E8">图片 · 图片型 PDF  →  IMA 解析  →  企微文档</text>

    <!-- Three stages -->
    <!-- Stage 1: input -->
    <g transform="translate(24 76)">
      <rect x="0" y="0" width="118" height="100" rx="10" fill="#11304B" stroke="#1F4866"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#7FB6D9">INPUT</text>
      <!-- image icon -->
      <rect x="14" y="32" width="40" height="40" rx="4" fill="#1A8FFF" opacity="0.18"/>
      <rect x="14" y="32" width="40" height="40" rx="4" fill="none" stroke="#5BD8C2" stroke-width="1.4"/>
      <circle cx="24" cy="42" r="3" fill="#5BD8C2"/>
      <path d="M14 72 L26 60 L34 66 L48 52 L54 58" stroke="#9DD4FF" stroke-width="1.2" fill="none"/>
      <!-- pdf icon -->
      <rect x="64" y="32" width="40" height="40" rx="4" fill="#5BD8C2" opacity="0.16"/>
      <rect x="64" y="32" width="40" height="40" rx="4" fill="none" stroke="#5BD8C2" stroke-width="1.4"/>
      <text x="72" y="56" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#F4F8FB">PDF</text>
      <text x="14" y="92" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#C5D8E8">图片 / 图片型 PDF</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M152 126 L188 126" stroke="#1A8FFF" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M188 126 L184 121 M188 126 L184 131" stroke="#1A8FFF" stroke-width="1.6" fill="none"/>

    <!-- Stage 2: IMA -->
    <g transform="translate(196 76)">
      <rect x="0" y="0" width="100" height="100" rx="10" fill="#1A8FFF" opacity="0.12"/>
      <rect x="0" y="0" width="100" height="100" rx="10" fill="none" stroke="#1A8FFF" stroke-width="1.6"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#9DD4FF">IMA</text>
      <circle cx="50" cy="55" r="22" fill="none" stroke="#9DD4FF" stroke-width="1.5"/>
      <circle cx="50" cy="55" r="10" fill="#1A8FFF"/>
      <circle cx="42" cy="49" r="2" fill="#5BD8C2"/>
      <circle cx="58" cy="49" r="2" fill="#5BD8C2"/>
      <text x="14" y="92" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#F4F8FB">IMA 解析</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M306 126 L342 126" stroke="#5BD8C2" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M342 126 L338 121 M342 126 L338 131" stroke="#5BD8C2" stroke-width="1.6" fill="none"/>

    <!-- Stage 3: output -->
    <g transform="translate(346 76)">
      <rect x="0" y="0" width="58" height="100" rx="10" fill="#11304B" stroke="#1F4866"/>
      <!-- mini table -->
      <rect x="6" y="14" width="46" height="40" rx="3" fill="#0E2A3E" stroke="#5BD8C2" stroke-width="1"/>
      <line x1="6" y1="27" x2="52" y2="27" stroke="#5BD8C2" stroke-width="0.8" opacity="0.6"/>
      <line x1="29" y1="14" x2="29" y2="54" stroke="#5BD8C2" stroke-width="0.8" opacity="0.6"/>
      <circle cx="16" cy="20" r="1.5" fill="#9DD4FF"/>
      <circle cx="40" cy="20" r="1.5" fill="#9DD4FF"/>
      <line x1="11" y1="35" x2="24" y2="35" stroke="#7FB6D9" stroke-width="1"/>
      <line x1="11" y1="44" x2="24" y2="44" stroke="#7FB6D9" stroke-width="1"/>
      <line x1="34" y1="35" x2="47" y2="35" stroke="#7FB6D9" stroke-width="1"/>
      <line x1="34" y1="44" x2="47" y2="44" stroke="#7FB6D9" stroke-width="1"/>
      <text x="6" y="76" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10" fill="#C5D8E8">智能表格</text>
      <text x="6" y="92" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="10" fill="#C5D8E8">/在线表格</text>
    </g>

    <!-- Row 2: destination cards -->
    <g transform="translate(24 196)">
      <rect x="0" y="0" width="380" height="92" rx="10" fill="#0E2A3E" stroke="#1F4866"/>
      <text x="14" y="22" font-family="ui-monospace, monospace" font-size="11" fill="#7FB6D9">DESTINATION · 企业微信文档</text>

      <g transform="translate(14 32)">
        <!-- smartsheet -->
        <rect x="0" y="0" width="110" height="48" rx="6" fill="#11304B" stroke="#5BD8C2" stroke-opacity="0.5"/>
        <text x="10" y="20" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#F4F8FB">智能表格</text>
        <text x="10" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#9DD4FF">add_records</text>

        <!-- spreadsheet -->
        <rect x="124" y="0" width="110" height="48" rx="6" fill="#11304B" stroke="#5BD8C2" stroke-opacity="0.5"/>
        <text x="134" y="20" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#F4F8FB">在线表格</text>
        <text x="134" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#9DD4FF">update_cells</text>

        <!-- document -->
        <rect x="248" y="0" width="118" height="48" rx="6" fill="#11304B" stroke="#5BD8C2" stroke-opacity="0.5"/>
        <text x="258" y="20" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="600" fill="#F4F8FB">在线文档</text>
        <text x="258" y="38" font-family="ui-monospace, monospace" font-size="10" fill="#9DD4FF">append_text</text>
      </g>
    </g>
  </g>

  <!-- Footer badges -->
  <g transform="translate(56 388)">
    <rect x="0" y="-18" width="64" height="22" rx="11" fill="#11304B" stroke="#1F4866"/>
    <text x="32" y="-3" font-family="ui-monospace, monospace" font-size="11" fill="#9DD4FF" text-anchor="middle">curl</text>

    <rect x="74" y="-18" width="78" height="22" rx="11" fill="#11304B" stroke="#1F4866"/>
    <text x="113" y="-3" font-family="ui-monospace, monospace" font-size="11" fill="#9DD4FF" text-anchor="middle">纯 Shell</text>

    <rect x="160" y="-18" width="92" height="22" rx="11" fill="#11304B" stroke="#1F4866"/>
    <text x="206" y="-3" font-family="ui-monospace, monospace" font-size="11" fill="#9DD4FF" text-anchor="middle">IMA 沙箱友好</text>

    <rect x="262" y="-18" width="72" height="22" rx="11" fill="#11304B" stroke="#1F4866"/>
    <text x="298" y="-3" font-family="ui-monospace, monospace" font-size="11" fill="#9DD4FF" text-anchor="middle">MIT</text>
  </g>
</svg>
