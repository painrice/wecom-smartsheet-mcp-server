<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">运行架构图</title>
  <desc id="arch-desc">IMA 沙箱中的 SKILL 通过 curl 调用企业微信文档 API，实现智能表格、在线表格、在线文档的读写。</desc>

  <defs>
    <linearGradient id="row-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A8FFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#5BD8C2" stop-opacity="0.18"/>
    </linearGradient>
    <marker id="arr-end" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5BD8C2"/>
    </marker>
    <marker id="arr-end-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1A8FFF"/>
    </marker>
  </defs>

  <rect width="1200" height="420" rx="22" fill="#F7FAFC"/>
  <rect x="1" y="1" width="1198" height="418" rx="21" fill="none" stroke="#DCE5EE"/>

  <text x="40" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" fill="#1A8FFF" letter-spacing="2">ARCHITECTURE</text>
  <text x="40" y="74" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#0E2A3E">从 IMA 对话到企微文档的四跳链路</text>

  <!-- 4 nodes horizontally -->
  <g font-family="-apple-system, 'PingFang SC', sans-serif">

    <!-- Node 1: IMA -->
    <g transform="translate(40 130)">
      <rect x="0" y="0" width="220" height="160" rx="14" fill="#FFFFFF" stroke="#1A8FFF" stroke-width="1.8"/>
      <rect x="14" y="14" width="46" height="22" rx="11" fill="#1A8FFF" opacity="0.16"/>
      <text x="37" y="29" font-size="11" font-weight="700" fill="#1A8FFF" text-anchor="middle">#01</text>
      <text x="14" y="64" font-size="18" font-weight="700" fill="#0E2A3E">腾讯 IMA</text>
      <text x="14" y="90" font-size="13" fill="#5A6E83">用户与 Agent 对话入口</text>
      <g transform="translate(14 102)" font-size="12" font-family="ui-monospace, monospace" fill="#3B556E">
        <text y="14">· 图片 / 图片型 PDF</text>
        <text y="34">· 沙箱内执行 shell</text>
        <text y="54">· 仅依赖 curl</text>
      </g>
    </g>

    <!-- Arrow -->
    <line x1="262" y1="210" x2="328" y2="210" stroke="#1A8FFF" stroke-width="2" marker-end="url(#arr-end-blue)"/>

    <!-- Node 2: this skill -->
    <g transform="translate(336 130)">
      <rect x="0" y="0" width="240" height="160" rx="14" fill="url(#row-grad)" stroke="#1A8FFF" stroke-width="2.4"/>
      <rect x="14" y="14" width="46" height="22" rx="11" fill="#1A8FFF"/>
      <text x="37" y="29" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">★</text>
      <text x="14" y="64" font-size="18" font-weight="700" fill="#0E2A3E">wecom-sheet SKILL</text>
      <text x="14" y="90" font-size="13" fill="#5A6E83">本仓库</text>
      <g transform="translate(14 102)" font-size="12" font-family="ui-monospace, monospace" fill="#3B556E">
        <text y="14">· curl 命令模板</text>
        <text y="34">· 字段去重 · 增删改查</text>
        <text y="54">· 真实经验沉淀</text>
      </g>
    </g>

    <!-- Arrow -->
    <line x1="578" y1="210" x2="644" y2="210" stroke="#5BD8C2" stroke-width="2" marker-end="url(#arr-end)"/>

    <!-- Node 3: API -->
    <g transform="translate(652 130)">
      <rect x="0" y="0" width="220" height="160" rx="14" fill="#FFFFFF" stroke="#1F4866" stroke-width="1.4"/>
      <rect x="14" y="14" width="46" height="22" rx="11" fill="#1F4866" opacity="0.18"/>
      <text x="37" y="29" font-size="11" font-weight="700" fill="#1F4866" text-anchor="middle">#03</text>
      <text x="14" y="64" font-size="18" font-weight="700" fill="#0E2A3E">企微文档 OpenAPI</text>
      <text x="14" y="90" font-size="13" fill="#5A6E83">qyapi.weixin.qq.com</text>
      <g transform="translate(14 102)" font-size="11.5" font-family="ui-monospace, monospace" fill="#3B556E">
        <text y="14">· wedoc/smartsheet</text>
        <text y="34">· wedoc/spreadsheet</text>
        <text y="54">· wedoc/document</text>
      </g>
    </g>

    <!-- Arrow -->
    <line x1="874" y1="210" x2="940" y2="210" stroke="#5BD8C2" stroke-width="2" marker-end="url(#arr-end)"/>

    <!-- Node 4: Docs -->
    <g transform="translate(948 130)">
      <rect x="0" y="0" width="212" height="160" rx="14" fill="#FFFFFF" stroke="#5BD8C2" stroke-width="1.8"/>
      <rect x="14" y="14" width="46" height="22" rx="11" fill="#5BD8C2" opacity="0.18"/>
      <text x="37" y="29" font-size="11" font-weight="700" fill="#0F8B73" text-anchor="middle">#04</text>
      <text x="14" y="64" font-size="18" font-weight="700" fill="#0E2A3E">企业微信文档</text>
      <text x="14" y="90" font-size="13" fill="#5A6E83">团队协同一处可见</text>
      <g transform="translate(14 102)" font-size="12" font-family="ui-monospace, monospace" fill="#3B556E">
        <text y="14">· 智能表格</text>
        <text y="34">· 在线表格</text>
        <text y="54">· 在线文档</text>
      </g>
    </g>
  </g>

  <!-- Footnote -->
  <g transform="translate(40 326)">
    <rect x="0" y="0" width="1120" height="64" rx="10" fill="#EAF4FB" stroke="#CFE3F1"/>
    <text x="20" y="24" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="600" fill="#0E2A3E">关键约束</text>
    <text x="20" y="46" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="12.5" fill="#3B556E">IMA 沙箱无 httpx/requests → 必须用 curl；企微需白名单沙箱出口 IP；智能表格字段只用 FIELD_TYPE_TEXT，逐个添加而非批量。</text>
  </g>
</svg>
